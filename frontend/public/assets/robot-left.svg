<svg width="180" height="200" viewBox="0 0 180 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot Head -->
  <rect x="40" y="20" width="100" height="80" rx="10" fill="#FF6B6B" stroke="#1A1A2E" stroke-width="4"/>
  
  <!-- Robot Eyes -->
  <circle cx="70" cy="50" r="15" fill="#1A1A2E"/>
  <circle cx="110" cy="50" r="15" fill="#1A1A2E"/>
  <circle cx="70" cy="50" r="5" fill="#4ECDC4" class="eye-glow"/>
  <circle cx="110" cy="50" r="5" fill="#4ECDC4" class="eye-glow"/>
  
  <!-- Robot Mouth -->
  <rect x="60" y="80" width="60" height="10" rx="5" fill="#1A1A2E"/>
  
  <!-- Robot Antenna -->
  <rect x="80" y="5" width="20" height="15" fill="#FFE66D"/>
  <circle cx="90" cy="5" r="5" fill="#4ECDC4" class="antenna-light"/>
  
  <!-- Robot Body -->
  <rect x="50" y="110" width="80" height="60" rx="10" fill="#4ECDC4" stroke="#1A1A2E" stroke-width="4"/>
  
  <!-- Robot Controls -->
  <circle cx="70" cy="130" r="8" fill="#FFE66D" stroke="#1A1A2E" stroke-width="2"/>
  <circle cx="110" cy="130" r="8" fill="#FFE66D" stroke="#1A1A2E" stroke-width="2"/>
  <rect x="65" y="150" width="50" height="10" rx="5" fill="#1A1A2E"/>
  
  <!-- Robot Arms -->
  <rect x="20" y="120" width="30" height="10" rx="5" fill="#FF6B6B" stroke="#1A1A2E" stroke-width="2"/>
  <rect x="10" y="120" width="10" height="30" rx="5" fill="#FF6B6B" stroke="#1A1A2E" stroke-width="2"/>
  
  <!-- Robot Legs -->
  <rect x="60" y="170" width="15" height="30" rx="5" fill="#1A1A2E"/>
  <rect x="105" y="170" width="15" height="30" rx="5" fill="#1A1A2E"/>
  
  <style>
    .eye-glow {
      animation: glow 1.5s infinite alternate;
    }
    .antenna-light {
      animation: blink 1s infinite;
    }
    @keyframes glow {
      from { opacity: 0.7; }
      to { opacity: 1; r: 8; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.3; }
    }
  </style>
</svg> 